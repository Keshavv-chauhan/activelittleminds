<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="author" content="Active Little Minds" />

    <!-- Google Search Console ownership. Carried over from the previous
         (GoDaddy) site so the existing property stays verified. -->
    <meta
      name="google-site-verification"
      content="AMmt9ig1C2dYuZpx0CvwhLLrMIkk8nqw74t3EhgCxeY"
    />

    <!-- Default title/description for the dev server. In the production build
         scripts/prerender.cjs replaces these (and adds the canonical URL,
         social tags and structured data) separately for every page. -->
    <title>Speech Therapy for Kids, Palam Vihar | Active Little Minds</title>
    <meta
      name="description"
      content="Child development centre in Palam Vihar, Gurugram: speech, occupational and physio therapy plus special education under one roof. Free first consultation."
    />

    <!-- Icons: generated from the ALM logo by scripts/tools/optimize-images.mjs -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Analytics 4 (G-39K18ZX0KT).
         - Runs only on the real site, never on localhost or preview hosts.
         - The gtag.js file is fetched once the page has loaded and the browser
           is idle, so measurement never competes with rendering (LCP / INP).
         - Consent Mode v2: measurement is on by default, but visitors in the
           EEA, UK and Switzerland start with everything denied until a consent
           banner grants it. Ad storage is denied everywhere; no ads are used. -->
    <script>
      (function () {
        var host = location.hostname;
        if (host !== 'activelittleminds.com' && host !== 'www.activelittleminds.com') return;

        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;

        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied',
          region: ['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','GB','CH']
        });
        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied'
        });
        gtag('js', new Date());
        gtag('config', 'G-39K18ZX0KT');

        function load() {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-39K18ZX0KT';
          document.head.appendChild(s);
        }
        function schedule() {
          if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 4000 });
          else setTimeout(load, 2000);
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule);
      })();
    </script>
  </head>
  <body>
    <noscript>
      Active Little Minds is a child development centre at H.No. 692, Sector 23,
      near Ansal Plaza, Gurugram 122017, Haryana. Call +91 93547 51149.
    </noscript>
    <div id="root"></div>
  </body>
</html>
