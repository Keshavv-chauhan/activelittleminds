name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alm-web
    steps:
      - uses: actions/checkout@v4

      # Requires Settings > Pages > Source = "GitHub Actions" (one-time, admin
      # only — the default GITHUB_TOKEN is not allowed to enable Pages itself).
      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: alm-web/package-lock.json

      - run: npm ci

      # PUBLIC_URL also becomes the React Router basename (see src/index.js).
      # When the custom domain is attached, set this to an empty string.
      - run: npm run build
        env:
          CI: true
          PUBLIC_URL: /activelittleminds

      # GitHub Pages serves 404.html for unknown paths; handing it the app
      # shell lets client-side routes load when opened directly.
      - run: cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: alm-web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
