name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alm-web
    steps:
      - uses: actions/checkout@v4

      # Requires Settings > Pages > Source = "GitHub Actions" (one-time, admin
      # only — the default GITHUB_TOKEN is not allowed to enable Pages itself).
      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: alm-web/package-lock.json

      - run: npm ci

      # Serving from the apex domain activelittleminds.com, so the site lives
      # at the root: PUBLIC_URL stays empty. `npm run build` also renders every
      # page to static HTML, writes 404.html / sitemap.xml / robots.txt, and runs
      # the SEO + broken-link checks: any failure stops the deploy.
      - run: npm run build
        env:
          CI: true
          PUBLIC_URL: ''

      - uses: actions/upload-pages-artifact@v3
        with:
          path: alm-web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
